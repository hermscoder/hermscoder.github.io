
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productize Yourself — AI Prompt Builder</title>

<style>
body{
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    margin:0;
    background:#0f172a;
    color:#e5e7eb;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    opacity:0.8;
    margin-bottom:30px;
}

.card{
    background:#111827;
    padding:20px;
    border-radius:12px;
    margin-bottom:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

label{
    font-weight:600;
    display:block;
    margin-bottom:6px;
}

textarea,input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #374151;
    background:#020617;
    color:white;
    margin-bottom:10px;
    resize:vertical;
}

textarea{
    min-height:80px;
}

button{
    background:#6366f1;
    border:none;
    padding:14px 20px;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    color:white;
    width:100%;
    margin-top:10px;
}

button:hover{
    background:#4f46e5;
}

.output{
    white-space:pre-wrap;
    background:#020617;
    padding:20px;
    border-radius:10px;
    border:1px solid #374151;
    margin-top:20px;
}

.copy{
    background:#10b981;
    margin-top:10px;
}

footer{
    text-align:center;
    margin-top:40px;
    opacity:0.6;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>Productize Yourself</h1>
<div class="subtitle">AI Prompt Builder — Fill the fields and generate your strategy prompt</div>

<div class="card">
<label>Skills</label>
<textarea id="skills"></textarea>

<label>Industries You Know</label>
<textarea id="industries"></textarea>

<label>Interests / Obsessions</label>
<textarea id="interests"></textarea>

<label>Life Experiences</label>
<textarea id="experiences"></textarea>

<label>Things People Ask You For Help With</label>
<textarea id="help"></textarea>

<label>Technical Skills</label>
<textarea id="tech"></textarea>

<label>Audience / Platforms</label>
<textarea id="audience"></textarea>

<label>Network / Team</label>
<textarea id="network"></textarea>

<label>Financial Resources</label>
<textarea id="money"></textarea>

<label>AI Tools You Can Use</label>
<textarea id="ai"></textarea>

<label>Available Hours Per Week</label>
<input id="hours">

<label>Current Job / Business</label>
<textarea id="job"></textarea>

<label>Target Audience You Like Helping</label>
<textarea id="target"></textarea>

<button onclick="generatePrompt()">Generate AI Prompt</button>

</div>

<div class="card">
<h2>Your Generated Prompt</h2>
<div id="result" class="output"></div>
<button class="copy" onclick="copyPrompt()">Copy Prompt</button>
</div>

<footer>
Built for the “Productize Yourself” workflow • Paste the prompt into ChatGPT / Claude
</footer>

</div>

<script>

function generatePrompt(){

let prompt = `You are a startup strategist applying Naval Ravikant’s principles of Specific Knowledge and Leverage.

Use the user inputs to design a scalable one-person business strategy.

--------------------------------

USER PROFILE

Skills:
${skills.value}

Industries:
${industries.value}

Interests:
${interests.value}

Life Experiences:
${experiences.value}

Things People Ask Me For Help With:
${help.value}

Technical Skills:
${tech.value}

Audience / Platforms:
${audience.value}

Network / Team:
${network.value}

Financial Resources:
${money.value}

AI Tools Available:
${ai.value}

Hours Available Per Week:
${hours.value}

Current Job or Business:
${job.value}

Target Audience:
${target.value}

--------------------------------

TASKS

1. Identify my Specific Knowledge Intersections
2. Evaluate leverage options: Code, Media, Capital, Labor
3. Suggest 10 scalable business opportunities
4. Analyze the top 3 ideas
5. Design productized versions
6. Create a One‑Person Startup Architecture
7. Build‑in‑Public content strategy
8. 12‑month roadmap
9. Naval retirement test

Return sections:

1. Specific Knowledge
2. Leverage Analysis
3. Opportunity List
4. Best Business Idea
5. Productization Strategy
6. One‑Person Startup Design
7. Content Engine
8. 12‑Month Plan
9. Retirement Test Score`

document.getElementById("result").textContent = prompt
}

function copyPrompt(){

let text = document.getElementById("result").textContent

navigator.clipboard.writeText(text)

alert("Prompt copied! Paste it into your AI.")
}

</script>

</body>
</html>
